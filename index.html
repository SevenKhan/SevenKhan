<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SevenKhan — İlk Sayfam</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Merhaba, SevenKhan!</h1>
    <p id="clock">Saat: --:--:--</p>
    <p>Bu, GitHub Pages ile yayınlanacak basit bir sayfa örneğidir.</p>
    <button id="magic">Bana tıkla</button>
    <p>Sayaç: <span id="counter">0</span></p>
    <p id="message"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>

<!-- Oyun kutusu -->
<div id="game-box" style="
  position:absolute;
  width:50px;
  height:50px;
  background: linear-gradient(135deg,#ff7e5f,#feb47b);
  border-radius:8px;
  top:50%;
  left:50%;
  transform: translate(-50%,-50%);
  cursor:pointer;
"></div>

<p>Puan: <span id="score">0</span></p>
